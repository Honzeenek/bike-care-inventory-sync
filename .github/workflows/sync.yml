name: Inventory sync

on:
  schedule:
    # ~every 20 min at off-peak minutes. GitHub heavily throttles/drops
    # scheduled jobs (worst at the top of the hour, ":00"), so we avoid :00
    # and run 3×/hour — this shrinks how long stale stock can linger when
    # GitHub delays a run. Cadence is still best-effort, not guaranteed.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Dry run (log only, write nothing)"
        type: boolean
        default: false
      debug_sku:
        description: "Print raw feed block(s) for CODE(s), comma-separated (no writes)"
        type: string
        default: ""

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sync
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          FEED_URL: ${{ secrets.FEED_URL }}
          # Optional overrides (defaults live in sync.js):
          # SHOPIFY_LOCATION_ID: gid://shopify/Location/120161861972
          # SKU_PREFIX: "DY-"
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          DEBUG_SKU: ${{ github.event.inputs.debug_sku }}
        run: node sync.js
