name: Inventory sync

on:
  schedule:
    # Hourly at :17 (NOT :00 — GitHub delays/drops scheduled jobs most at the
    # top of the hour). This GitHub schedule is only a BEST-EFFORT FALLBACK and
    # can still be delayed hours or skipped. The RELIABLE hourly trigger is an
    # external pinger (cron-job.org) that POSTs to this workflow's
    # workflow_dispatch endpoint every hour — GitHub runs dispatched jobs
    # immediately, with no throttling. See README "Reliable scheduling".
    - cron: "17 * * * *"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Dry run (log only, write nothing)"
        type: boolean
        default: false
      debug_sku:
        description: "Print raw feed block(s) for CODE(s), comma-separated (no writes)"
        type: string
        default: ""
      audit:
        description: "Read-only health report: feed vs live store qty + tracking (no writes)"
        type: boolean
        default: false

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sync
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          FEED_URL: ${{ secrets.FEED_URL }}
          # Optional overrides (defaults live in sync.js):
          # SHOPIFY_LOCATION_ID: gid://shopify/Location/120161861972
          # SKU_PREFIX: "DY-"
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          DEBUG_SKU: ${{ github.event.inputs.debug_sku }}
          AUDIT: ${{ github.event.inputs.audit == 'true' && '1' || '' }}
        run: node sync.js
